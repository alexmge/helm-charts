apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pyplanet.fullname" . }}
  labels:
    {{- include "pyplanet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pyplanet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pyplanet.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.persistence.enabled }}
      initContainers:
        - name: init-pyplanet-data
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              if [ -z "$(find /data -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
                cp -a /app/server/. /data/
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: pyplanet
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          env:
            - name: PYPLANET_SETTINGS_METHOD
              value: {{ .Values.config.settingsMethod | quote }}
            - name: PYPLANET_SETTINGS_DIRECTORY
              value: {{ .Values.config.settingsDirectory | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.settingsDirectory | quote }}
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- if .Values.sharedMaps.enabled }}
            - name: shared-maps
              mountPath: {{ .Values.sharedMaps.mountPath | quote }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "pyplanet.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pyplanet.fullname" . }}
        {{- end }}
        {{- if .Values.sharedMaps.enabled }}
        - name: shared-maps
          persistentVolumeClaim:
            claimName: {{ include "pyplanet.sharedMapsClaimName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
